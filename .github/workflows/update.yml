name: Update stock dashboard
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/update.yml"
  schedule:
    # Taiwan time (UTC+8)
    - cron: "30 0 * * 1-5"      # 08:30 pre-market
    - cron: "0,30 1-5 * * 1-5" # 09:00-13:30 every 30 min
    - cron: "0 6 * * 1-5"       # 14:00 post-close
    - cron: "30 10 * * 1-5"     # 18:30 evening refresh
    - cron: "30 13 * * 1-5"     # 21:30 news refresh
concurrency:
  group: stock-dashboard-update
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scripts/update_data.py
      - name: Commit updated data
        run: |
          git config user.name "stock-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json data/score_history.json
          git diff --cached --quiet || git commit -m "Update stock data"
          git pull --rebase origin main
          git push origin main
